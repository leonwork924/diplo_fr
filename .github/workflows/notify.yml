name: diplo_fr - notification quotidienne

on:
  schedule:
    # Les nominations passent en Conseil des ministres, en général le
    # mercredi. Vérifie tous les jours en semaine pour ne pas dépendre d'un
    # calendrier fixe (le Conseil peut être décalé).
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (n'envoie aucun email, affiche seulement)"
        type: boolean
        default: false
      days_back:
        description: "Nombre de jours en arrière à chercher (mets 60 pour un premier test, avant de revenir à une petite valeur en usage normal)"
        type: string
        default: "8"
      test_recipient:
        description: "Si rempli, TOUS les emails partent à cette adresse au lieu des vrais destinataires (test réel sans déranger les filiales)"
        type: string
        default: ""
      limit:
        description: "Limite le nombre de nominations traitées (vide = pas de limite). Utile pour un tout premier envoi réel, ex. 2"
        type: string
        default: ""
      backfill:
        description: "Peuple l'historique (active_postings.json) SANS envoyer d'email -- à cocher une fois avec days_back=1500 avant le premier vrai lancement, pour que l'estimation à 4 ans ait des données dès maintenant"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Vérifie l'extraction contre les fixtures avant tout run réel
        run: |
          cd src
          python3 -c "
          import json
          from extract import extract_nomination
          samples = json.load(open('../fixtures/justicelibre_samples.json', encoding='utf-8'))
          ok = sum(1 for s in samples if extract_nomination(s['id'], s['extract']))
          print(f'{ok}/{len(samples)} extraits correctement reconnus')
          assert ok >= 9, 'régression détectée dans extract.py'
          "

      - name: Run
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        run: |
          cd src
          python3 main.py \
            --days-back ${{ github.event.inputs.days_back || '8' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ github.event.inputs.test_recipient != '' && format('--test-recipient {0}', github.event.inputs.test_recipient) || '' }} \
            ${{ github.event.inputs.limit != '' && format('--limit {0}', github.event.inputs.limit) || '' }} \
            ${{ github.event.inputs.backfill == 'true' && '--backfill' || '' }} \
            2>&1 | tee ../data/last_run.log

      - name: Commit et push la mémoire mise à jour
        run: |
          git config user.name "diplo-fr-bot"
          git config user.email "diplo-fr-bot@users.noreply.github.com"
          git add data/seen.json data/active_postings.json data/last_run.log
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git commit -m "Update seen.json"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main -X ours
            sleep 5
          done
          exit 1
